name: Build and Release AppImage

# Every push to main builds the AppImage and publishes it as a new GitHub
# Release automatically. Tag format is v<package.json version>-<short sha>
# so it can never collide with a manually created release tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y jq unzip fuse3
      - run: npm ci
      - run: npm run prebuild:rclone
      - run: npm run build
      - run: npx electron-builder --linux AppImage

      - name: Compute release tag
        id: tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=v${PKG_VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: icloud-explorer-appimage
          path: release/*.AppImage

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" release/*.AppImage \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Automated build from commit ${{ github.sha }}."
